name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ResearchSpace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q .

      - name: Unit tests (synthetic data, always run)
        run: python -m unittest discover -s tests -v

      - name: Chart / HTML regression (skipped without real data)
        # 数据文件（data_power_minute.csv / out/）不入库；
        # 缺失时用例自动跳过，需要在内网跑 s1_fetch.py + s3_run.py 后覆写
        run: python test_chart_documentation.py -v
