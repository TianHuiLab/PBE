name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ResearchSpace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q .

      - name: Unit and synthetic end-to-end tests (always run)
        run: python -m unittest discover -s tests -v

      - name: Real-data chart / HTML regression (data-dependent cases skipped on CI)
        # 数据文件（data_power_minute.csv / out/）不入库；
        # CI 的合成 CSV→评估→图表→HTML 用例在 tests/test_pipeline.py 中始终运行。
        run: python test_chart_documentation.py -v
